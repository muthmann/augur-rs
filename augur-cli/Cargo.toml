[package]
name = "augur-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["self-update"]
# `augur update`. On by default for the binaries we publish; packagers who
# manage upgrades themselves can build without it.
self-update = ["dep:augur-update"]

[[bin]]
name = "augur"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
augur-core = { path = "../augur-core" }
augur-runtime.workspace = true
augur-prophesee = { path = "../augur-prophesee" }
augur-update = { workspace = true, optional = true }
clap.workspace = true
ctrlc.workspace = true
toml.workspace = true
