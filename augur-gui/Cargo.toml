[package]
name = "augur-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
hdf5 = ["augur-core/hdf5"]

[[bin]]
name = "AugurRS"
path = "src/main.rs"

[dependencies]
augur-core = { path = "../augur-core" }
augur-plugin-api = { path = "../augur-plugin-api" }
augur-prophesee = { path = "../augur-prophesee" }
bytemuck.workspace = true
crossbeam-channel.workspace = true
eframe = { workspace = true, features = ["wgpu"] }
egui.workspace = true
egui-wgpu.workspace = true
egui-phosphor.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
glam = "0.27"
libloading.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tiff.workspace = true
toml.workspace = true

[dev-dependencies]
criterion = "0.5"
pollster = "0.3"

[[bench]]
name = "preview_bench"
harness = false
