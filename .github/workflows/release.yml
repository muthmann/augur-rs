name: Release

# This workflow is deliberately NOT triggered by `on: push: tags`.
#
# release-please creates the version tag using the default GITHUB_TOKEN, and
# GitHub does not start workflow runs from GITHUB_TOKEN-created events. A tag
# trigger therefore never fired, which is why v1.0.0 shipped with zero release
# assets. release-please.yml calls this workflow directly instead, and
# workflow_dispatch gives a way to rebuild or dry-run packaging by hand.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build and attach artifacts to.
        required: true
        type: string
      publish:
        description: Upload artifacts to the GitHub release for that tag.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or ref to build (defaults to the branch this is run from).
        required: false
        type: string
      publish:
        description: Upload to the GitHub release. Leave off for a packaging dry run.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build DMG and CLI archive
        run: bash resources/packaging/macos/build-dmg.sh --out dist

      - name: Smoke-test the disk image
        run: bash resources/packaging/macos/verify-dmg.sh dist

      # The bundle swap is the riskiest step in the whole update path: copy it
      # with the wrong tool and the signature silently stops validating.
      - name: Verify the in-app update swap
        run: bash resources/packaging/macos/verify-update-swap.sh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        run: bash .github/scripts/install-linux-deps.sh

      - name: Build AppImage and CLI archive
        run: bash resources/packaging/linux/build-appimage.sh --out dist

      - name: Smoke-test the AppImage
        run: bash resources/packaging/linux/verify-appimage.sh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build installer and portable archive
        shell: pwsh
        run: ./resources/packaging/windows/build-installer.ps1 -OutDir dist

      # Actually installs, runs, and uninstalls. The silent path exercised here
      # is the same one the in-app updater invokes.
      - name: Smoke-test the installer
        shell: pwsh
        run: ./resources/packaging/windows/verify-installer.ps1 -DistDir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*setup.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Checksum and publish
    runs-on: ubuntu-latest
    needs: [macos, linux, windows]
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Collect artifacts and write SHA256SUMS
        run: |
          mkdir -p dist
          find staged -type f -exec mv -t dist {} +
          cd dist
          # The in-app updater treats this file as mandatory and refuses to
          # apply anything whose hash is missing or does not match.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
