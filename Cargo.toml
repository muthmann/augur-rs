[workspace]
members = [
  "augur-core",
  "augur-prophesee",
  "augur-cli",
  "augur-gui",
  "augur-plugin-api",
  "plugins/hotpixel",
  "plugins/localization",
  "plugins/focus-metrics",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Mika Uthmann <muthmann@physik.uni-bielefeld.de>"]

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = "0.27"
egui = "0.27"
evt3-core = { path = "../evt3_core" }
hdf5 = { package = "hdf5-metno", version = "0.12.3" }
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"
ctrlc = "3"
rfd = "0.15"
rustfft = "6"
serde_json = "1"
libloading = "0.8"
