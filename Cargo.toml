[workspace]
members = [
  "augur-event-types",
  "augur-core",
  "augur-runtime",
  "augur-prophesee",
  "augur-cli",
  "augur-gui",
  "augur-plugin-api",
  "augur-plugin-types",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.0.0"
authors = ["Mika Uthmann <muthmann@physik.uni-bielefeld.de>"]

[workspace.dependencies]
anyhow = "1"
augur-event-types = { path = "augur-event-types" }
augur-runtime = { path = "augur-runtime" }
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = "0.27"
egui = "0.27"
egui-wgpu = "0.27"
egui-phosphor = "0.5"
egui_extras = "0.27"
egui_plot = "0.27"
evt3-core = "0.2.0"
hdf5 = { package = "hdf5-metno", version = "0.12.3" }
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"
ctrlc = "3"
rfd = "0.15"
rustfft = "6"
serde_json = "1"
libloading = "0.8"
image = { version = "0.24.9", default-features = false, features = ["png", "tiff"] }
tiff = "0.9"
gethostname = "1"
time = { version = "=0.3.36", features = ["formatting"] }
